name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e './apps/api[dev]'
      - name: Lint backend
        run: ruff check apps/api/app apps/api/tests scripts
      - name: Check backend formatting
        run: ruff format --check apps/api/app apps/api/tests scripts
      - name: Test backend
        working-directory: apps/api
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: labelguard-ai:ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke-test client
        run: pip install 'httpx>=0.28,<1'
      - name: Verify running container with real OCR
        run: |
          docker run --detach --name labelguard-ci --publish 127.0.0.1:8000:8000 labelguard-ai:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:8000/api/health
          docker exec labelguard-ci tesseract --version
          docker exec labelguard-ci tesseract --list-langs
          python scripts/verify_container.py --base-url http://127.0.0.1:8000 --requests 5
      - name: Container logs
        if: always()
        run: docker logs labelguard-ci || true
